<div class="content-container">
    <header class="section-header">
        <h1 id="ui-title">Comma - 多媒體下載器</h1>
    </header>
    
    <div class="feed-input">
        <div class="input-group">
            <label class="lang-url">影片網址</label>
            <input type="text" id="url-input" placeholder="貼上 YouTube 連結...">
        </div>
    
        <div class="action-buttons">
            <button class="btn-post" id="btn-download-v">下載影片 (MP4)</button>
            <button class="btn-post" id="btn-download-a">下載音訊 (MP3)</button>
            <div class="sub-buttons">
                <button class="btn-secondary" id="btn-stop" disabled>停止</button>

            </div>
        </div>
    </div>

    <div id="dynamic-card" class="dynamic-card">
        <div class="preview-container">
            <img id="preview-img" src="https://via.placeholder.com/240x135/111/fff?text=Waiting" alt="Thumbnail">
            <div class="post-info">
                <div id="video-title" class="post-header">影片標題正在載入...</div>
                <div id="video-uploader">頻道名稱</div>
                <div id="video-duration">時長: 00:00</div>
            </div>
        </div>

        <div id="res-selector-container" class="res-pills-wrapper" style="display: none;">
            <div id="res-pills-container" class="res-pills-flex"></div>
        </div>

        <div id="progress-section" class="progress-container" style="display: none;">
            <div class="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
            <div class="status-text">
                <span id="stat-percent">0%</span>
                <span id="stat-speed">速度: 0 MB/s</span>
                <span id="stat-eta">剩餘時間: --:--</span>
            </div>
        </div>
    </div>
</div>
